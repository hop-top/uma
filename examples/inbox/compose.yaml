# Local services for the durable inbox example: PostgreSQL for the store and
# a development mail relay that catches email replies (web UI on :8025).
# Both publish on loopback only.
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: uma
      POSTGRES_PASSWORD: uma
      POSTGRES_DB: inbox
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uma", "-d", "inbox"]
      interval: 2s
      retries: 15
  relay:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
