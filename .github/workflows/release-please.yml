name: release-please

on:
  push:
    branches: [next]
  # Manual re-run when the standing release PR needs rebuilding against its branch.
  workflow_dispatch: {}

# One run at a time: a stale run racing a fresh one can re-open a release PR
# for a version that was just tagged.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Short-lived installation token from the release-bot GitHub App, so
      # release PRs come from release-bot[bot] and trigger downstream checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
