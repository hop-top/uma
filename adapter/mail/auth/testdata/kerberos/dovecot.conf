protocols = imap
listen = *
log_path = /dev/stderr
auth_verbose = yes
auth_debug = yes

ssl = required
ssl_cert = </etc/dovecot/tls/cert.pem
ssl_key = </etc/dovecot/tls/key.pem
disable_plaintext_auth = yes

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

auth_mechanisms = plain gssapi
auth_gssapi_hostname = mail.example.test
auth_krb5_keytab = /etc/dovecot/imap.keytab
auth_username_format = %Ln

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%Ln /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%Ln
}
mail_location = maildir:~/Maildir
