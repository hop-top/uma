protocols = imap
listen = *
log_path = /dev/stderr
auth_verbose = yes

# TLS before AUTH, as the adapter requires; the certificate is installed by
# up.sh under /etc/dovecot/tls.
ssl = required
ssl_cert = </etc/dovecot/tls/server.pem
ssl_key = </etc/dovecot/tls/server.key
disable_plaintext_auth = yes

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

auth_mechanisms = plain
mail_max_userip_connections = 100

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}
mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
  # Special-use mailboxes (RFC 6154), for the state verbs: archive, trash and
  # junk resolve to these. Created at first use of the account.
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}
